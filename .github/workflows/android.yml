name: Build ToDo Shift APK

on:
  push:
    branches: [ "main", "v0.5-development", "v0.9-development", "Premium-V-byWork" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"

      - name: Build Debug APK
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "APK SIGNATURE VERIFIED"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate.*sha" | head -1 | grep -Eo "[[:xdigit:]]{64}" | head -1 | tr "A-F" "a-f")
          EXPECTED_SHA="aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9"
          echo "APK CERTIFICATE: $CERT_SHA"
          if [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "CERTIFICATE FINGERPRINT MISMATCH"
            exit 1
          fi
          echo "CERTIFICATE FINGERPRINT MATCH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToDoShift-NeoLuxury-3.0-Test
          path: app/build/outputs/apk/debug/app-debug.apk
