name: Premium baseline signed build (no release)

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/premium/stable-candidate'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preserved app source
        run: |
          test "$GITHUB_REF" = refs/heads/premium/stable-candidate
          git diff --exit-code 2bc80943c90215cecea0db9c037f59ee9915f3cb HEAD -- app

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"

      - name: Build Debug APK
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle --no-daemon -I tools/premium_qa.init.gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "APK SIGNATURE VERIFIED"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate.*sha" | head -1 | grep -Eo "[[:xdigit:]]{64}" | head -1 | tr "A-F" "a-f")
          EXPECTED_SHA="aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9"
          echo "APK CERTIFICATE: $CERT_SHA"
          if [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "CERTIFICATE FINGERPRINT MISMATCH"
            exit 1
          fi
          echo "CERTIFICATE FINGERPRINT MATCH"
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 tools/verify_premium_apk.py "$APK" --build-tools "$(dirname "$APKSIGNER")" --expected-certificate "$EXPECTED_SHA" --expected-sha "$GITHUB_SHA" --output delivery/identity
          python3 -c 'import json; p="delivery/identity/BUILD-IDENTITY.json"; d=json.load(open(p)); d["classification"]="PERSISTENT-SIGNED BASELINE TEST — release HOLD; installed certificate unverified"; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          APK_NAME=$(python3 -c 'import json; c=json.load(open("tools/PREMIUM_CANDIDATE.json")); print("ToDoShift-"+c["versionName"]+"-vc"+str(c["versionCode"])+"-PERSISTENT-TEST.apk")')
          mkdir -p delivery
          cp "$APK" "delivery/$APK_NAME"
          cp "$RUNNER_TEMP/apk-badging.txt" delivery/APK-BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > delivery/APK-SIGNATURE.txt
          git rev-parse HEAD > delivery/SOURCE-COMMIT.txt
          printf '%s\n' "Package: com.todoshift.app" "Version: see APK-BADGING.txt" "Certificate SHA-256: $CERT_SHA" "Installed-app certificate: NOT VERIFIED" "Upgrade safety: requires matching installed certificate; do not uninstall or clear data" > delivery/BUILD-IDENTITY.txt
          (cd delivery && sha256sum *.apk *.txt > SHA256SUMS)

      - name: Preserve functional QA evidence
        run: |
          mkdir -p delivery-qa
          cp -R app/build/test-results/testDebugUnitTest delivery-qa/junit
          cp -R app/build/reports/tests/testDebugUnitTest delivery-qa/tests
          cp app/build/reports/lint-results-debug.* delivery-qa/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-baseline-CI-Test
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-baseline-QA
          path: |
            delivery-qa/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

      - name: Capture native-render diagnostics (not device acceptance)
        continue-on-error: true
        run: gradle -I tools/visual_capture.init.gradle testDebugUnitTest --tests '*NeoVisualProbeTest' --stacktrace > visual-probe.log 2>&1

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-baseline-Visual-Diagnostics
          path: |
            app/build/ux-visual-evidence/
            visual-probe.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
