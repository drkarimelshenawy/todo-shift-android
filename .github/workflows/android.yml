name: Verify and build ToDo Shift 4.1

permissions:
  contents: read

on:
  push:
    branches: [ "main", "v0.5-development", "v0.9-development", "Premium-V-byWork" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"

      - name: Build Debug APK
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "APK SIGNATURE VERIFIED"
          CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate.*sha" | head -1 | grep -Eo "[[:xdigit:]]{64}" | head -1 | tr "A-F" "a-f")
          EXPECTED_SHA="aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9"
          echo "APK CERTIFICATE: $CERT_SHA"
          if [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "CERTIFICATE FINGERPRINT MISMATCH"
            exit 1
          fi
          echo "CERTIFICATE FINGERPRINT MATCH"
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.todoshift.app' versionCode='30' versionName='4.1.1'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p delivery
          cp "$APK" delivery/ToDoShift-4.1.1-vc30-CI-TEST.apk
          cp "$RUNNER_TEMP/apk-badging.txt" delivery/APK-BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > delivery/APK-SIGNATURE.txt
          git rev-parse HEAD > delivery/SOURCE-COMMIT.txt
          printf '%s\n' "Package: com.todoshift.app" "Version: 4.1.1 (30)" "Certificate SHA-256: $CERT_SHA" "Installed-app certificate: NOT VERIFIED" "Upgrade safety: requires matching installed certificate; do not uninstall or clear data" > delivery/BUILD-IDENTITY.txt
          (cd delivery && sha256sum *.apk *.txt > SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToDoShift-4.1.1-vc30-CI-Test
          path: delivery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToDoShift-4.1.1-vc30-QA
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
