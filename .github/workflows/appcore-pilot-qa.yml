name: AppCore ExMore pilot QA (no release)
on:
  push:
    branches: [feat/exmore-official-identity-migration]
    paths:
      - 'app/src/main/java/com/exmore/app/appcore/**'
      - 'app/src/main/java/com/exmore/app/MainActivity.kt'
      - 'app/src/main/java/com/exmore/app/v11/ui/NeoRescueSettings.kt'
      - 'app/src/test/java/com/exmore/app/appcore/**'
      - '.github/workflows/appcore-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: appcore-exmore-pilot-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK packages (hosted runner tools)
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test on supported JVM (no signing or release)
        run: |
          gradle --no-daemon --max-workers=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx3584m -Dfile.encoding=UTF-8' -I tools/premium_qa.init.gradle \
            :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Report every failed test and full suite counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          for file in files:
              root = ET.parse(file).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print('FAILED', case.get('classname'), case.get('name'))
                      print((failure.text or failure.get('message', ''))[:2500])
          print('JUnit result:', totals, 'XML files:', len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exmore-pilot-qa-evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
