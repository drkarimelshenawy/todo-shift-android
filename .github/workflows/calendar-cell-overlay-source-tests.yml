name: Calendar cell overlay fix — tests only, NO APK
on:
  push:
    branches: [fix/v440-calendar-cell-overlay-20261123]
    paths:
      - 'app/**'
      - 'tools/verify_calendar_cell_overlay.py'
      - '.github/workflows/calendar-cell-overlay-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify paint overlays do not mask whole-cell shift coverage
        run: python3 tools/verify_calendar_cell_overlay.py
      - name: Verify unchanged cashbook integration routing
        run: python3 scripts/check_v44_cashbook_integration.py
      - name: Restore transient signing key for test configuration only
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Run calendar unit and Compose regression tests (no release assembly)
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx3584m -Dfile.encoding=UTF-8' -I tools/premium_qa.init.gradle \
              :app:testDebugUnitTest --tests com.todoshift.app.v11.NeoCalendarPresentationTest --tests com.todoshift.app.v11.ui.CalendarUiRegressionTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/calendar-tests-attempt-$attempt.log"; then
              exit 0
            fi
            if ! grep -Eq 'Received status code 429|Too Many Requests|HTTP/1.1 429|HTTP/2 429' "$RUNNER_TEMP/calendar-tests-attempt-$attempt.log"; then
              echo "Test failed for a non-rate-limit reason; not retrying." >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency server rate-limited all three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 35))
          done
      - name: Upload unit-test evidence only (NO APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v440-calendar-overlay-unit-tests
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Remove transient signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
