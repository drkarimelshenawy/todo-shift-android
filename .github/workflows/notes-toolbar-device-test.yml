name: Notes Toolbar Emulator Visibility Test

on:
  push:
    branches:
      - test/notes-toolbar-visibility-20261117
      - feat/v60-notes-toolbar-verified-20261117
    paths:
      - 'app/**'
      - '.github/workflows/notes-toolbar-device-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-note-dialog:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real note editor and collect full-screen screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 440
            mkdir -p device-evidence
            bash -c 'gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace; status=$?; adb pull /sdcard/Download/notes-toolbar-01-closed.png device-evidence/ || true; adb pull /sdcard/Download/notes-toolbar-02-open.png device-evidence/ || true; exit "$status"'
      - name: Publish screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-toolbar-emulator-screenshots
          path: device-evidence/
          if-no-files-found: warn
