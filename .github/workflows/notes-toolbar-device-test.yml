name: v65 theme and A4 emulator checks

on:
  push:
    branches: [feat/v65-nile-jade]
    paths:
      - 'app/**'
      - 'cashbook-feature/**'
      - 'tools/verify_v65_update.py'
      - 'tools/check_v65_apk_update.sh'
      - '.github/workflows/notes-toolbar-device-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-note-dialog:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test theme, navigation, A4 and APK upgrade on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime list -s
            adb shell settings get secure show_ime_with_hard_keyboard
            mkdir -p device-evidence
            bash -c 'gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.todoshift.app.v11.ui.NeoDocumentPdfDeviceTest,com.todoshift.app.v11.ui.NeoA4EditingDeviceTest,com.todoshift.app.v11.ui.NeoThemeDeviceTest --stacktrace; result=$?; adb pull /sdcard/Download/nile-jade/. device-evidence/; exit $result'
            if [ "${{ matrix.api-level }}" = "35" ]; then bash tools/check_v65_apk_update.sh; fi
      - name: Publish screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nile-jade-screens-api-${{ matrix.api-level }}
          path: |
            device-evidence/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
