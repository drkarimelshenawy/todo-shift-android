name: Premium complete UI — signed candidate & QA

on:
  push:
    branches:
      - feat/premium-complete-ui-vc43
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tools/PREMIUM_CANDIDATE.json'
      - 'tools/verify_premium_apk.py'
      - 'tools/premium_qa.init.gradle'
      - 'tools/visual_capture.init.gradle'
      - 'tools/visual-tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate:
    if: github.ref == 'refs/heads/feat/premium-complete-ui-vc43'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin exact source branch
        run: |
          git checkout -B feat/premium-complete-ui-vc43 "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key securely
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Unit tests, lint and assemble
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle --no-daemon -I tools/premium_qa.init.gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Validate exact APK identity, signature and alignment
        run: |
          python3 tools/verify_premium_apk.py app/build/outputs/apk/debug/app-debug.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --expected-certificate aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9 \
            --expected-sha "$GITHUB_SHA" \
            --expected-branch feat/premium-complete-ui-vc43 \
            --output delivery/identity
          cp app/build/outputs/apk/debug/app-debug.apk delivery/ToDoShift-4.6.0-premium-complete-vc43.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS)
      - name: Copy QA evidence
        if: always()
        run: |
          mkdir -p delivery/qa
          cp -R app/build/test-results/testDebugUnitTest delivery/qa/junit 2>/dev/null || true
          cp app/build/reports/lint-results-debug.* delivery/qa/ 2>/dev/null || true
          python3 tools/premium_qa_summary.py
      - name: Native Compose visual probes
        run: gradle --no-daemon -I tools/premium_qa.init.gradle -I tools/visual_capture.init.gradle testDebugUnitTest --tests '*NeoVisualProbeTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToDoShift-vc43-PERSISTENT-SIGNED-TEST
          path: |
            delivery/
            app/build/ux-visual-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Wipe signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"

  emulator-acceptance:
    if: always() && needs.signed-candidate.result != 'cancelled'
    needs: signed-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ToDoShift-vc43-PERSISTENT-SIGNED-TEST
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: Premium-PERSISTENT-SIGNED-APK
          path: baseline
          run-id: 43464124421
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          disable-animations: true
          script: python3 tools/premium_device_smoke.py "$(find baseline -name '*.apk' -print -quit)" "$(find candidate -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToDoShift-vc43-Android35-acceptance
          path: device-smoke/
          if-no-files-found: error
          retention-days: 30

  focused-calendar-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Focused calendar regressions
        run: gradle --no-daemon -I tools/premium_qa.init.gradle testDebugUnitTest --tests '*CalendarUiRegressionTest' --tests '*PremiumCompleteLayoutTest' --tests '*ModernUiIntegrationTest' --stacktrace
      - name: Large-text native render
        if: always()
        run: gradle --no-daemon -I tools/premium_qa.init.gradle -I tools/visual_capture.init.gradle testDebugUnitTest --tests '*NeoVisualProbeTest.captureNarrowEmptyCalendarWithLargeText' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Calendar-focused-layout-evidence
          path: |
            app/build/ux-visual-evidence/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
