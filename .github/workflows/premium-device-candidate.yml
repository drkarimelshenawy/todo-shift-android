name: Premium vc43 exact APK device acceptance
on:
  push:
    branches: [feat/premium-complete-ui-vc43]
    paths:
      - tools/premium_device_smoke.py
      - .github/workflows/premium-device-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ToDoShift-vc43-PERSISTENT-SIGNED-TEST
          run-id: 43477544032
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: Premium-PERSISTENT-SIGNED-APK
          path: baseline
          run-id: 43464124421
          github-token: ${{ github.token }}
      - name: Pin tested APK source and signature
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=next(Path('candidate').rglob('BUILD-IDENTITY.json'))
          d=json.loads(p.read_text())
          assert d['sourceCommit']=='d262d79fbdd39d99ede2c3e81511d3cbbf2ef95f'
          assert d['certificateSHA256']=='aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9'
          assert d['signatureVerification']==d['zipalign']=='PASS'
          PYCODE
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          disable-animations: true
          script: python3 tools/premium_device_smoke.py "$(find baseline -name '*.apk' -print -quit)" "$(find candidate -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToDoShift-vc43-Android35-acceptance
          path: device-smoke/
          if-no-files-found: error
          retention-days: 30
