name: v44 Cash Book signed APK

on:
  push:
    branches: [feat/v44-cashbook-integration]
    paths:
      - 'cashbook-core/**'
      - 'cashbook-feature/**'
      - 'app/**'
      - 'scripts/check_v44_cashbook_integration.py'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/v44-cashbook-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v44-cashbook-signed
  cancel-in-progress: false

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/feat/v44-cashbook-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin source branch
        run: git checkout -B feat/v44-cashbook-integration "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify integration structure
        run: python3 scripts/check_v44_cashbook_integration.py
      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Verify financial idempotency and build signed APK
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle --no-daemon -I tools/premium_qa.init.gradle :cashbook-core:runSalaryIncomeIdempotencyTest :app:testDebugUnitTest --tests 'com.todoshift.app.integration.SalaryCashPostingCoordinatorTest' :app:assembleDebug --stacktrace
      - name: Verify APK signature and identity
        run: |
          python3 tools/verify_premium_apk.py app/build/outputs/apk/debug/app-debug.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --expected-certificate aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9 \
            --expected-sha "$GITHUB_SHA" \
            --expected-branch feat/v44-cashbook-integration \
            --output delivery/identity
          cp app/build/outputs/apk/debug/app-debug.apk delivery/ToDoShift-v44-CashBook.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoShift-v44-signed-APK
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v44-cashbook-${GITHUB_SHA:0:12}"
          gh release create "$TAG" delivery/ToDoShift-v44-CashBook.apk delivery/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "ToDo Shift v44 Cash Book" --notes "Signed test APK. Source: $GITHUB_SHA. Cash Book receipt integration with durable idempotent posting."
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
