name: v44 Cash Book integration compile checks

on:
  push:
    branches: [feat/v44-cashbook-integration]
    paths:
      - 'cashbook-core/**'
      - 'cashbook-feature/**'
      - 'app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/v44-cashbook-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile modules and run core tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :cashbook-core:check :cashbook-feature:compileDebugKotlin :app:compileDebugKotlin :app:testDebugUnitTest
