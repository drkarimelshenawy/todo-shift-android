name: v44 Cash Book integration checks

on:
  push:
    branches: [feat/v44-cashbook-integration]
    paths:
      - 'cashbook-core/**'
      - 'cashbook-feature/**'
      - 'app/**'
      - 'scripts/check_v44_cashbook_integration.py'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/v44-cashbook-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Cash Book navigation and finance lock invariants
        run: python3 scripts/check_v44_cashbook_integration.py
      - name: Compile imported Cash Book and host app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :cashbook-core:check :cashbook-feature:compileDebugKotlin :app:compileDebugKotlin
      - name: Run salary to cash idempotency tests
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --tests 'com.todoshift.app.integration.SalaryCashPostingCoordinatorTest'
      - name: Run full host unit test suite (diagnostic)
        if: success()
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
