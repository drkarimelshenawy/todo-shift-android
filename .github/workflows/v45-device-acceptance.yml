name: v45 published APK device acceptance

on:
  push:
    branches: [feat/v45-complete-specification]
    paths:
      - 'tools/v45_device_smoke.py'
      - '.github/workflows/v45-device-acceptance.yml'
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Published signed candidate tag
        default: v45-cashbook-99ff5055a143
        type: string
      candidate_sha256:
        description: Verified candidate SHA256
        default: 7e9d473476f1fe34e6e60418ead300bee510fb005a90c53632358a4daaf01754
        type: string

permissions:
  contents: read

jobs:
  update-and-note-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse verified signed APK without rebuilding
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag || 'v45-cashbook-99ff5055a143' }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 || '7e9d473476f1fe34e6e60418ead300bee510fb005a90c53632358a4daaf01754' }}
        run: |
          mkdir -p candidate
          curl --fail --location --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CANDIDATE_TAG}/ToDoShift-v45-CashBook.apk" -o candidate/ToDoShift-v45-CashBook.apk
          printf '%s  candidate/ToDoShift-v45-CashBook.apk\n' "$CANDIDATE_SHA256" | sha256sum -c -
      - name: Download verified v44 baseline
        run: |
          curl --fail --location --retry 3 https://github.com/drkarimelshenawy/todo-shift-android/releases/download/v44-cashbook-7887df97526e/ToDoShift-v44-CashBook.apk -o baseline.apk
          echo '0311df1225967259602c3bd7086db6c5e37746b36a6e748ec9dcfc48871aa872  baseline.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          script: python3 tools/v45_device_smoke.py baseline.apk candidate/ToDoShift-v45-CashBook.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToDoShift-v45-emulator-acceptance
          path: device-smoke/
          if-no-files-found: warn
