name: v63 Build-only Signed APK (tests run separately)
on:
  push:
    branches: [feat/v63-notes-workflow-a4-20261118]
    paths: ['.github/workflows/v63-build-only.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin source branch
        run: git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify integration structure
        run: python3 scripts/check_v44_cashbook_integration.py
      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Assemble signed APK (independent of unit tests)
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle --no-daemon -I tools/premium_qa.init.gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature and identity
        run: |
          python3 tools/verify_premium_apk.py app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --expected-certificate aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9 \
            --expected-sha "$GITHUB_SHA" \
            --expected-branch "$GITHUB_REF_NAME" --require-release \
            --output delivery/identity
          cp app/build/outputs/apk/release/app-release.apk delivery/ToDoShift-v63-Notes-Workflow-A4.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ToDoShift-v63-buildonly-signed-APK
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v63-notes-buildonly-${GITHUB_SHA:0:12}"
          gh release create "$TAG" delivery/ToDoShift-v63-Notes-Workflow-A4.apk delivery/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "ToDo Shift v63 — Notes workflow A4 beta (build-only)" \
            --notes "Signed v63 APK. Compilation and APK signature validated; regression tests run in a separate workflow and require independent review. A4 is experimental. Physical-device acceptance pending. Source: $GITHUB_SHA."
      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v63-notes-buildonly-${GITHUB_SHA:0:12}"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" --pattern ToDoShift-v63-Notes-Workflow-A4.apk --dir "$RUNNER_TEMP/published"
          cmp delivery/ToDoShift-v63-Notes-Workflow-A4.apk "$RUNNER_TEMP/published/ToDoShift-v63-Notes-Workflow-A4.apk"
          python3 -c "import zipfile; z=zipfile.ZipFile('$RUNNER_TEMP/published/ToDoShift-v63-Notes-Workflow-A4.apk'); assert z.testzip() is None"
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
