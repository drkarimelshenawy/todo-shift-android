name: v70 Comprehensive App QA & Signed APK

on:
  push:
    branches: [fix/v70-whole-app-audit-20261121, feat/v70-calendar-navigation-salary-20261121]
    paths:
      - 'cashbook-core/**'
      - 'cashbook-feature/**'
      - 'app/**'
      - 'cashbook-core/**'
      - '.github/workflows/v70-whole-app-audit.yml'
      - 'tools/PREMIUM_CANDIDATE.json'
      - 'scripts/check_v44_cashbook_integration.py'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v45-cashbook-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/fix/v70-whole-app-audit-20261121' || github.ref == 'refs/heads/feat/v70-calendar-navigation-salary-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin source branch
        run: git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify integration structure
        run: python3 scripts/check_v44_cashbook_integration.py
      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.TODOSHIFT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/todoshift.jks"
          chmod 600 "$RUNNER_TEMP/todoshift.jks"
      - name: Full unit tests, static lint and signed APK
        env:
          TODOSHIFT_SIGNING_FILE: ${{ runner.temp }}/todoshift.jks
          TODOSHIFT_SIGNING_PASSWORD: ${{ secrets.TODOSHIFT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TODOSHIFT_SIGNING_PASSWORD"
          gradle --no-daemon --max-workers=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs='-Xmx3584m -Dfile.encoding=UTF-8' -I tools/premium_qa.init.gradle \
            :cashbook-core:check :cashbook-feature:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Diagnose Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for file in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              try:
                  root=ET.parse(file).getroot()
                  for case in root.iter("testcase"):
                      fail=case.find("failure")
                      if fail is not None:
                          print("FAILED TEST:",case.get("classname"),case.get("name"))
                          print("MESSAGE:",fail.get("message",""))
                          print((fail.text or "")[:6000])
              except Exception as error:
                  print("Failed to read XML:",file,error)
          PY
      - name: Save complete QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExMore-v70-full-QA-evidence
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            cashbook-core/build/test-results/**/*.xml
            cashbook-feature/build/test-results/**/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify APK signature and identity
        run: |
          python3 tools/verify_premium_apk.py app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --expected-certificate aecf41e372d7204dacf6ebb93f02414b265c8d97fd5508023287aa2fc6da6ea9 \
            --expected-sha "$GITHUB_SHA" \
            --expected-branch "$GITHUB_REF_NAME" --require-release \
            --output delivery/identity
          cp app/build/outputs/apk/release/app-release.apk delivery/ExMore-v70-Implementation.apk
          (cd delivery && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ExMore-v70-signed-APK
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v70-app-audit-${GITHUB_SHA:0:12}"
          gh release create "$TAG" delivery/ExMore-v70-Implementation.apk delivery/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "ExMore v70 — Implementation Candidate" --notes "Cross-module QA, corrected settings-versus-tool navigation, salary statement earning-month reconciliation and interface refinements; existing financial records preserved. Source: $GITHUB_SHA."
      - name: Verify published APK bytes and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v70-app-audit-${GITHUB_SHA:0:12}"
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" --pattern ExMore-v70-Audited.apk --dir "$RUNNER_TEMP/published"
          cmp delivery/ExMore-v70-Audited.apk "$RUNNER_TEMP/published/ExMore-v70-Audited.apk"
          python3 -c "import zipfile; z=zipfile.ZipFile('$RUNNER_TEMP/published/ExMore-v70-Audited.apk'); assert z.testzip() is None"
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/todoshift.jks"
